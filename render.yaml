# Render.com blueprint — deploys Virtual Engineer as a public web service.
# In Render: New + → Blueprint → connect this repo. It reads this file.
# Set ANTHROPIC_API_KEY in the dashboard (it is NOT stored in the repo).
services:
  - type: web
    name: virtual-engineer
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ANTHROPIC_API_KEY
        sync: false   # prompted in the dashboard; kept secret, never in the repo
